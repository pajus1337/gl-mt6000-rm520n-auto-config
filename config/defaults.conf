# Default configuration values for RM520NGL + Waveshare setup
# Override any value by creating config/user.conf

# GitHub repository base URL (used when running via curl | sh)
REPO_URL="https://raw.githubusercontent.com/pajus1337/gl-mt6000-rm520n-auto-config/master"

# Modem USB identification
MODEM_VID="2c7c"
MODEM_PID="0801"

# AT command serial port (auto-detected if empty)
AT_PORT=""
AT_BAUD="115200"
AT_TIMEOUT="5"

# Expected modem DHCP subnet from GbE interface
MODEM_GW_IP="192.168.225.1"
MODEM_SUBNET="192.168.225.0/24"

# WAN interface name to create/update in OpenWrt
WAN_IFACE="wan"

# APN — set by user during install if not overridden here
APN=""
PDP_TYPE="IPV4V6"
AUTH_TYPE="none"

# QMI management interface (USB path, monitoring only)
QMI_IFACE="wwan_mgmt"
QMI_DEVICE="/dev/cdc-wdm0"

# OpenWrt minimum supported version
MIN_OPENWRT_MAJOR="25"
MIN_OPENWRT_MINOR="12"

# Packages required for USB management path
PACKAGES_USB="kmod-usb-serial-option kmod-usb-net-qmi-wwan kmod-usb-wdm uqmi luci-proto-qmi"

# Modem reboot wait time (seconds) after AT+CFUN=1,1
MODEM_REBOOT_WAIT="20"

# Temporary working directory
TMP_DIR="/tmp/rm520n-setup-$$"
